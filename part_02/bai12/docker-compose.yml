services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  node-exporter:
    image: prom/node-exporter
    container_name: node-exported
    ports:
      - "9100:9100"
  
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"