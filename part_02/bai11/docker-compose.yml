services:
  db:
    image: postgres:15
    container_name: pg_db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  
  adminer:
    image: adminer
    container_name: pg_adminer
    restart: always
    ports:
      - "8083:8080"
    depends_on: 
      - db
    
volumes:
  pg_data: