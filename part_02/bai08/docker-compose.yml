services:
  db:
    image: mysql:latest
    container_name: my_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  web:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data: